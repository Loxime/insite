name: insite

services:

  web:
    container_name: insite_app
    build: .
    ports:
        - "8080:80"
    volumes:
        - .:/var/www/html

  postgres:
    image: postgres:latest
    container_name: insite_db
    environment:
      POSTGRES_DB: ${POSTGRES_NAME}
      POSTGRES_USER: ${POSTGRE_USER}
      POSTGRES_PASSWORD: ${POSTGRE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
