name: insite_prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: insite_prod
      POSTGRES_USER: insite_prod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}

    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U insite_prod -d insite_prod
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    build:
      context: .
      dockerfile: Dockerfile
      target: minio

    image: insite-minio:prod
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}

    volumes:
      - minio_prod_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-prod

    image: insite-web:prod
    restart: unless-stopped

    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
      APP_SECRET: ${APP_SECRET:?APP_SECRET required}

      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}

      MAILER_DSN: ${MAILER_DSN:?MAILER_DSN required}
      DEFAULT_URI: ${DEFAULT_URI:?DEFAULT_URI required}

      CONTACT_FROM: ${CONTACT_FROM:?CONTACT_FROM required}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:?CONTACT_RECIPIENT required}

      JAM_TIMEZONE: ${JAM_TIMEZONE:-Europe/Paris}

      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT required}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

    ports:
      - "127.0.0.1:${INSITE_PROD_PORT:-8081}:80"

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS --max-time 5 http://127.0.0.1/ >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_prod_data:
  minio_prod_data:
